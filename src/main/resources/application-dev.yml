spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sinatra_dev
    username: sinatra_user
    password: ${DB_PASSWORD:dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  redis:
    host: localhost
    port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  health:
    redis:
      enabled: true
