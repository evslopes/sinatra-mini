spring:
  datasource:
    # Configurado dinamicamente pelo TestContainers via @DynamicPropertySource
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: false  # Permite limpar o banco em testes

logging:
  level:
    pro.sinatra.mini: DEBUG
    org.hibernate.SQL: DEBUG
    org.testcontainers: INFO
