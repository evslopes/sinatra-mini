spring:
  datasource:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    defer-datasource-initialization: true

  flyway:
    enabled: true
    locations: classpath:db/migration-test
    baseline-on-migrate: true

  # Disable automatic execution of main `data.sql` in tests — we use test migrations instead
  sql:
    init:
      mode: never

logging:
  level:
    org.flywaydb: INFO
