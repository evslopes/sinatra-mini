# Flyway Configuration
# Usado para execução via linha de comando: ./mvnw flyway:migrate

# PostgreSQL Connection (dev)
flyway.url=jdbc:postgresql://localhost:5432/sinatra_dev
flyway.user=sinatra_user
flyway.password=dev_password

# Migration Settings
flyway.locations=classpath:db/migration
flyway.baselineOnMigrate=true
flyway.baselineVersion=0
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.outOfOrder=false

# Encoding
flyway.encoding=UTF-8
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

# Placeholders (se necessário)
flyway.placeholderReplacement=false

# Table
flyway.table=flyway_schema_history

# IMPORTANTE: Este arquivo contém credenciais de DEV
# Para produção, usar variáveis de ambiente no CI/CD
