name: CI — Build, Test & Containerize

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

jobs:
  build-and-test:
    name: Maven Verify (Java 17 + Testcontainers Postgres 15)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Execute Unit & Integration Suite
        run: |
          chmod +x ./mvnw
          ./mvnw clean verify -B

      - name: Validate Multi-Stage Production Docker Build
        run: docker build -t sinatra-mini:ci .

      - name: Archive Surefire Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
