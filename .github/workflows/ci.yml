name: CI - Build & Test

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

jobs:
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build and Test
        run: |
          # If repository layout uses sinatra-mini subdirectory (refactor), switch into it
          if [ -f "sinatra-mini/pom.xml" ]; then
            cd sinatra-mini
          fi

          # Prefer the Maven wrapper if available, fallback to system mvn
          if [ -x ./mvnw ]; then
            ./mvnw clean verify -B
          else
            mvn clean verify -B
          fi
      
      - name: Archive test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            sinatra-mini/target/surefire-reports/
            sinatra-mini/target/failsafe-reports/
          retention-days: 7
