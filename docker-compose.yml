version: '3.8'

services:
  # Aplicação Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sinatra_app
    image: sinatra-mini:latest
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sinatra_dev
      SPRING_DATASOURCE_USERNAME: sinatra_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-dev_password}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_password}
      SPRING_REDIS_PORT: 6379
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8080:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sinatra-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: sinatra_postgres_dev
    environment:
      POSTGRES_DB: sinatra_dev
      POSTGRES_USER: sinatra_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinatra_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sinatra-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sinatra_redis_dev
    command: redis-server --requirepass ${REDIS_PASSWORD:-dev_redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sinatra-network
    restart: unless-stopped

  flyway:
    image: flyway/flyway:9
    container_name: sinatra_flyway
    command: -url=jdbc:postgresql://postgres:5432/sinatra_dev -user=sinatra_user -password=${DB_PASSWORD:-dev_password} -locations=filesystem:/flyway/sql migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sinatra-network
    restart: "no"

volumes:
  postgres_data:
  redis_data:

networks:
  sinatra-network:
    driver: bridge
