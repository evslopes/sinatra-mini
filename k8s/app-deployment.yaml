# Sinatra Mini App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sinatra-app
  namespace: sinatra-mini
  labels:
    app: sinatra-app
    tier: application
spec:
  replicas: 3 # Alta disponibilidade com 3 réplicas
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero downtime deployment
  selector:
    matchLabels:
      app: sinatra-app
  template:
    metadata:
      labels:
        app: sinatra-app
        tier: application
    spec:
      containers:
      - name: sinatra-app
        image: sinatra-mini:latest # Atualizar com registry (ex: gcr.io/project/sinatra-mini:v1.1.0)
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: sinatra-app-config
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sinatra-secrets
              key: DB_PASSWORD
        - name: SPRING_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sinatra-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 12 # 120s total (12 * 10s)

---
# Sinatra App Service
apiVersion: v1
kind: Service
metadata:
  name: sinatra-app-service
  namespace: sinatra-mini
  labels:
    app: sinatra-app
spec:
  type: ClusterIP # Usar LoadBalancer para exposição externa ou Ingress
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: sinatra-app
  sessionAffinity: ClientIP # Sticky sessions para cache local
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800 # 3 horas

---
# HorizontalPodAutoscaler para escalonamento automático
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sinatra-app-hpa
  namespace: sinatra-mini
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sinatra-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # Esperar 5min antes de escalar para baixo
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max
