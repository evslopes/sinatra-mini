# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sinatra-mini
  labels:
    app: redis
    app.kubernetes.io/component: saas
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: sinatra-mini
    app.kubernetes.io/part-of: sinatra-platform
    app.kubernetes.io/version: 1.1.0
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      app.kubernetes.io/component: saas
      app.kubernetes.io/managed-by: kubectl
      app.kubernetes.io/name: sinatra-mini
      app.kubernetes.io/part-of: sinatra-platform
      app.kubernetes.io/version: 1.1.0
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/component: saas
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/name: sinatra-mini
        app.kubernetes.io/part-of: sinatra-platform
        app.kubernetes.io/version: 1.1.0
        tier: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - /bin/sh
        - -c
        - |
          redis-server --requirepass "$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sinatra-secrets
              key: REDIS_PASSWORD
        volumeMounts:
        - name: redis-storage
          mountPath: /data
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -a "$REDIS_PASSWORD" ping
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: sinatra-mini
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis
