# Secrets para dados sensíveis
# IMPORTANTE: Em produção, usar ferramentas como Sealed Secrets, External Secrets, ou Vault
# Este arquivo é apenas exemplo - NÃO commitar em produção com valores reais

apiVersion: v1
kind: Secret
metadata:
  name: sinatra-secrets
  namespace: sinatra-mini
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
---
# Secret para PostgreSQL
apiVersion: v1
kind: Secret
